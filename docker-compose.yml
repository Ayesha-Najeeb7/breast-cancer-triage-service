name: breast-cancer-triage
services:
  api:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/${IMAGE_NAME:-breast-cancer-triage-api}:${IMAGE_TAG:-1.0.0}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODEL_VERSION: ${MODEL_VERSION:-1.0.0}
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      MODEL_PATH: /app/artifacts/model.joblib
      DECISION_THRESHOLD: ${DECISION_THRESHOLD:-0.35}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MODEL_VERSION: ${MODEL_VERSION:-1.0.0}
      GIT_SHA: ${GIT_SHA:-unknown}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${HOST_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  redis-data:

